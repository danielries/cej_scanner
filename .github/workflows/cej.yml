name: CEJ boligovervågning

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: 

permissions:
  contents: write

concurrency:
  group: cej-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Sæt Python op
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer Playwright (Usynlig browser)
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Tjek CEJ for nye boliger
        run: python3 cej_monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}

      - name: Gem hvilke boliger der er set
        run: |
          git config user.name "cej-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Opdater sete boliger" && git push)